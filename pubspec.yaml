name: weather_rpg
description: A retro pixel-art RPG themed live weather app.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/monsoon_forest.png
    - assets/images/goblin_explorer.png
    - assets/images/goblin_frames/
